<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nearby — Restaurants &amp; Bars</title>
  <meta name="description" content="Find the best restaurants and bars near you and book a table directly on their website." />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">🍽️</span>
      <div>
        <h1>Nearby</h1>
        <p class="tagline">Restaurants &amp; bars around you</p>
      </div>
    </div>

    <div class="locate">
      <button id="locateBtn" class="btn btn-primary" type="button">
        <span aria-hidden="true">📍</span> Use my location
      </button>
      <form id="placeForm" class="place-form" role="search">
        <input id="placeInput" type="search" placeholder="…or enter a town / postcode" aria-label="Town or postcode" />
        <button class="btn" type="submit">Go</button>
      </form>
    </div>
  </header>

  <section class="controls" aria-label="Filters">
    <div class="chips" role="tablist" aria-label="Type">
      <button class="chip active" data-type="all" role="tab" aria-selected="true">All</button>
      <button class="chip" data-type="restaurant" role="tab" aria-selected="false">Restaurants</button>
      <button class="chip" data-type="bar" role="tab" aria-selected="false">Bars &amp; pubs</button>
    </div>
    <div class="selects">
      <label>Within
        <select id="radius">
          <option value="500">500 m</option>
          <option value="1000" selected>1 km</option>
          <option value="2000">2 km</option>
          <option value="5000">5 km</option>
        </select>
      </label>
      <label>Sort
        <select id="sort">
          <option value="best" selected>Best match</option>
          <option value="distance">Nearest</option>
          <option value="name">A–Z</option>
        </select>
      </label>
      <input id="filterText" type="search" placeholder="Filter: cuisine, name…" aria-label="Filter by cuisine or name" />
      <label class="toggle"><input id="bookableOnly" type="checkbox" /> Bookable online</label>
    </div>
  </section>

  <main class="layout">
    <section class="results" aria-live="polite">
      <div id="status" class="status">
        <h2>Find somewhere great to eat &amp; drink</h2>
        <p>Tap <strong>Use my location</strong> to see the best restaurants and bars near you, or enter a town or postcode.</p>
      </div>
      <ol id="list" class="list"></ol>
    </section>
    <section class="map-wrap">
      <div id="map" aria-label="Map of results"></div>
    </section>
  </main>

  <dialog id="detail" class="detail">
    <form method="dialog"><button class="close" aria-label="Close">✕</button></form>
    <div id="detailBody"></div>
  </dialog>

  <footer class="footer">
    Venue data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a>.
    Bookings are made directly on each business's own website.
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
